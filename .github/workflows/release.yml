name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: create release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { printing = 1; next }
            printing && /^## v/ { exit }
            printing { print }
          ' CHANGELOG.md > "$notes_file"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Switch++ ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --draft=false \
              --prerelease=false
          else
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Switch++ ${GITHUB_REF_NAME}" \
              --notes-file "$notes_file" \
              --target "${GITHUB_SHA}" \
              --verify-tag
          fi
          release_id="$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json databaseId --jq .databaseId)"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles app,dmg"
            cacheKey: macos-aarch64-app-dmg
            updaterManifest: macos-aarch64-latest.json

    runs-on: ${{ matrix.platform }}
    env:
      CLIPROXYAPI_TARGET: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v6.0.2

      - name: checkout private core
        uses: actions/checkout@v6.0.2
        with:
          repository: sssstwee/agent-switch-private-core
          token: ${{ secrets.AGENT_SWITCH_PRIVATE_CORE_TOKEN }}
          path: .private/agent-switch-private-core

      - name: setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 10

      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          shared-key: ${{ runner.os }}-${{ matrix.cacheKey }}

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: verify frontend tests
        run: pnpm test

      - name: verify frontend build
        run: pnpm build

      - name: verify rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: verify rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: verify rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: prepare release notes
        id: release_notes
        shell: bash
        run: |
          notes="$(awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag " " { printing = 1; next }
            printing && /^## v/ { exit }
            printing { print }
          ' CHANGELOG.md)"
          {
            echo "body<<EOF"
            echo "$notes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Switch++ ${{ github.ref_name }}"
          releaseBody: ${{ steps.release_notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: collect updater manifest
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          platform=""
          bundle_platform=""
          asset_name=""
          sig_pattern=""
          case "${{ matrix.updaterManifest }}" in
            macos-aarch64-latest.json)
              platform="darwin-aarch64"
              bundle_platform="darwin-aarch64-app"
              asset_name="Switch++_aarch64.app.tar.gz"
              sig_pattern="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig"
              ;;
            *)
              echo "unknown updater manifest ${{ matrix.updaterManifest }}" >&2
              exit 1
              ;;
          esac
          sig_files=( $sig_pattern )
          if [[ "${#sig_files[@]}" -ne 1 ]]; then
            echo "expected one updater signature for ${{ matrix.args }}, found ${#sig_files[@]}" >&2
            printf '%s\n' "${sig_files[@]}"
            exit 1
          fi
          signature="$(cat "${sig_files[0]}")"
          asset_url="$(jq -rn \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg tag "$GITHUB_REF_NAME" \
            --arg asset "$asset_name" \
            '"https://github.com/\($repo)/releases/download/\($tag)/\($asset | @uri)"')"
          mkdir -p updater-manifest
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg platform "$platform" \
            --arg bundle_platform "$bundle_platform" \
            --arg signature "$signature" \
            --arg url "$asset_url" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                ($platform): { signature: $signature, url: $url },
                ($bundle_platform): { signature: $signature, url: $url }
              }
            }' > "updater-manifest/${{ matrix.updaterManifest }}"
          jq '.platforms | keys' "updater-manifest/${{ matrix.updaterManifest }}"

      - name: upload updater manifest
        uses: actions/upload-artifact@v4
        with:
          name: updater-manifest-${{ matrix.updaterManifest }}
          path: updater-manifest/${{ matrix.updaterManifest }}
          if-no-files-found: error

  merge-updater-manifest:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: download updater manifests
        uses: actions/download-artifact@v4
        with:
          path: updater-manifests
          pattern: updater-manifest-*
          merge-multiple: true

      - name: merge and upload updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find updater-manifests -name '*.json' | sort)
          if [[ "${#manifests[@]}" -lt 1 ]]; then
            echo "expected 1 updater manifest, found ${#manifests[@]}" >&2
            printf '%s\n' "${manifests[@]}"
            exit 1
          fi
          notes="$(gh release view "${GITHUB_REF_NAME}" --json body --jq .body --repo "${GITHUB_REPOSITORY}")"
          jq -s '.[0] as $base | reduce .[] as $item ($base; .platforms = (.platforms + $item.platforms))' \
            "${manifests[@]}" |
            jq --arg notes "$notes" '.notes = $notes' > latest.json
          jq -e '
            (.platforms | has("darwin-aarch64")) and
            (.platforms | has("darwin-aarch64-app"))
          ' latest.json
          gh release upload "${GITHUB_REF_NAME}" latest.json --clobber --repo "${GITHUB_REPOSITORY}"
